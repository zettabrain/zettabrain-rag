[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zettabrain-rag"
version = "1.0.0"
description = "Private AI document assistant — local RAG and Skills. Chat with your documents and generate accurate business documents from them. Zero cloud required."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Olajide", email = "olajide@zettabrain.io" }
]
keywords = ["rag", "llm", "skills", "agent-skills", "ollama", "chromadb", "local-ai", "private-ai", "document-generation", "nfs", "smb", "object-storage", "gui", "private", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "langchain-ollama>=0.1.0",
  "langchain-chroma>=0.1.0",
  "langchain-core>=0.2.0",
  "langchain-text-splitters>=0.2.0",
  "chromadb>=0.5.0",
  "pypdf>=4.0.0",
  "pymupdf>=1.23.0",
  "python-docx>=1.1.0",
  "docx2txt>=0.8",
  "requests>=2.31.0",
  "httpx>=0.24",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.6",
  "websockets>=12.0",
  "rank-bm25>=0.2.0",
  "flashrank>=0.2.7",
  "pydantic>=2.0",
  "sqlmodel>=0.0.14",
  "python-frontmatter>=1.0",
  "openpyxl>=3.1",
  "PyJWT>=2.8",
  "bcrypt>=4.0",
  "msal>=1.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=24.0",
  "ruff>=0.4.0",
  "build",
  "twine",
]
openai = ["langchain-openai>=0.1", "openai>=1.0"]
claude = ["langchain-anthropic>=0.1", "anthropic>=0.25"]
all = [
  "langchain-openai>=0.1", "openai>=1.0",
  "langchain-anthropic>=0.1", "anthropic>=0.25",
  "fpdf2>=2.7",
]

[project.scripts]
zettabrain             = "zettabrain_rag.cli:main"
zettabrain-chat        = "zettabrain_rag.cli:chat_cmd"
zettabrain-ingest      = "zettabrain_rag.cli:ingest_cmd"
zettabrain-setup       = "zettabrain_rag.cli:setup_cmd"
zettabrain-status      = "zettabrain_rag.cli:status_cmd"
zettabrain-storage     = "zettabrain_rag.cli:storage_cmd"
zettabrain-server      = "zettabrain_rag.cli:server_cmd"
zettabrain-cert        = "zettabrain_rag.cli:cert_cmd"
zettabrain-postinstall = "zettabrain_rag.cli:post_install_cmd"
zettabrain-lite        = "zettabrain_rag.cli:server_cmd"

[project.urls]
Homepage   = "https://github.com/zettabrain/zettabrain-rag"
Repository = "https://github.com/zettabrain/zettabrain-rag"
Issues     = "https://github.com/zettabrain/zettabrain-rag/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["zettabrain_rag*"]

[tool.setuptools.package-data]
"zettabrain_rag" = [
  "skills/*.md",
  "scripts/*.sh",
  "scripts/*.conf",
  "scripts/*.py",
  "scripts/*",
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "static/*",
  "certs/.gitkeep",
]
